
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blood Request - LifeLink</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <nav>
        <h2 class="logo">LifeLink</h2>
        <a href="/">Home</a>
    </nav>

    <section class="form-section">
        <h1>Blood Request Information</h1>

        <p>This demonstration form does not send or store requests.
        For an actual need, contact a hospital or licensed blood bank.</p>

        <form onsubmit="showDemoMessage(event)">
            <select required>
                <option value="">Select Blood Group</option>
                <option>A+</option>
                <option>A-</option>
                <option>B+</option>
                <option>B-</option>
                <option>O+</option>
                <option>O-</option>
                <option>AB+</option>
                <option>AB-</option>
            </select>

            
            <input type="text" placeholder="Hospital city" required>

        <select name="urgency" required>
            <option value="Normal">Urgency: Normal</option>
            <option value="Urgent">Urgency: Urgent (Within 24 Hours)</option>
            <option value="Critical">Urgency: Critical (Immediate)</option>
        </select>

        <button type="submit">Submit Demo Request</button>
    </form>
            

        <p id="message"></p>
    </section>

    <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
